<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="ITDA 제3회 학술제 본선 발표. 일반의약품 기한·제조번호 OCR과 회수·반품 검토 보조.">
  <title>ITDA 본선 발표 · [CODE] 테러범</title>
  <style>:root {
  --ink: #0b1626;
  --muted: #5d6b7f;
  --soft: #eef3f9;
  --paper: #f8fbff;
  --white: #ffffff;
  --blue: #1e5bd8;
  --blue-deep: #103580;
  --blue-pale: #eaf1ff;
  --red: #e5484d;
  --red-pale: #fff0f1;
  --yellow: #f2b705;
  --yellow-pale: #fff7d6;
  --green: #345ed0;
  --green-pale: #edf3ff;
  --line: #d9e2ef;
  --shadow: 0 24px 70px rgba(8, 24, 51, 0.18);
  --font-sans: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background: #08111f;
  color: var(--ink);
  font-family: var(--font-sans);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

button,
a {
  font: inherit;
  touch-action: manipulation;
}

button {
  border: 0;
  cursor: pointer;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #8ab2ff;
  outline-offset: 3px;
}

button:disabled {
  cursor: default;
  opacity: 0.38;
}

.presentation {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: 58px minmax(0, 1fr) 68px;
}

.appbar,
.controlbar {
  position: relative;
  z-index: 30;
  display: flex;
  align-items: center;
  padding: 0 22px;
  color: #eaf2ff;
  background: rgba(7, 16, 30, 0.96);
}

.appbar {
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
}

.brand strong {
  font-size: 15px;
  letter-spacing: -0.25px;
  white-space: nowrap;
}

.brand span {
  overflow: hidden;
  color: #93a5be;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-actions,
.playback,
.jump-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chrome-button {
  min-height: 38px;
  padding: 0 13px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.06);
  color: #eaf2ff;
  font-size: 12px;
  font-weight: 700;
}

.chrome-button:hover {
  background: rgba(255, 255, 255, 0.12);
}

.chrome-button.primary {
  border-color: #3f78e8;
  background: var(--blue);
}

.viewport {
  position: relative;
  min-height: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 0%, rgba(40, 93, 182, 0.17), transparent 46%),
    #0a1423;
}

.stage-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.stage {
  position: relative;
  width: 1600px;
  height: 900px;
  overflow: hidden;
  transform-origin: top left;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 54px 80px 44px;
  background:
    linear-gradient(rgba(20, 66, 132, 0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20, 66, 132, 0.028) 1px, transparent 1px),
    radial-gradient(circle at 92% 4%, rgba(38, 105, 214, 0.09), transparent 27%),
    var(--paper);
  background-size: 80px 80px, 80px 80px, auto, auto;
}

.slide::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 8px;
  height: 100%;
  background: var(--blue);
  content: "";
}

.slide-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 30px;
  margin-bottom: 21px;
}

.slide-kicker {
  display: flex;
  align-items: center;
  gap: 13px;
  color: var(--blue);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.slide-kicker .number {
  color: #64758b;
  font-family: var(--font-mono);
  font-size: 15px;
  letter-spacing: 0.13em;
}

.source-count {
  color: #718198;
  font-size: 13px;
  font-weight: 700;
}

.slide-title {
  max-width: 1420px;
  margin: 0;
  color: var(--ink);
  font-size: 58px;
  font-weight: 900;
  letter-spacing: -0.045em;
  line-height: 1.08;
  white-space: pre-line;
  word-break: keep-all;
}

.slide-body {
  flex: 1;
  min-height: 0;
  margin-top: 34px;
}

.slide-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  color: #8290a3;
  font-size: 12px;
  letter-spacing: 0.06em;
}

.slide-footer .page-index {
  font-family: var(--font-mono);
}

.body-points {
  margin: 0;
  padding: 0;
  list-style: none;
}

.body-points li {
  position: relative;
  padding-left: 24px;
  color: #35445a;
  font-size: 28px;
  line-height: 1.55;
  word-break: keep-all;
}

.body-points li + li {
  margin-top: 10px;
}

.body-points li::before {
  position: absolute;
  top: 0.78em;
  left: 0;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--blue);
  content: "";
}

.eyebrow {
  color: var(--blue);
  font-size: 14px;
  font-weight: 850;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.caption {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  word-break: keep-all;
}

.status-tag {
  display: inline-flex;
  align-items: center;
  min-height: 27px;
  padding: 0 9px;
  border-radius: 6px;
  background: var(--blue-pale);
  color: var(--blue-deep);
  font-size: 12px;
  font-weight: 850;
}

.status-tag.red {
  background: var(--red-pale);
  color: #b4232e;
}

.status-tag.yellow {
  background: var(--yellow-pale);
  color: #805c00;
}

.status-tag.green {
  background: var(--green-pale);
  color: #087655;
}

.reveal {
  opacity: 0;
  transform: translateY(18px);
}

.slide.is-ready .reveal {
  opacity: 1;
  transform: none;
  transition:
    opacity 420ms ease calc(var(--reveal-index, 0) * 75ms),
    transform 420ms ease calc(var(--reveal-index, 0) * 75ms);
}

/* Cover */
.layout-cover {
  padding: 82px 92px 66px;
  background:
    radial-gradient(circle at 84% 25%, rgba(30, 91, 216, 0.18), transparent 32%),
    linear-gradient(130deg, #f9fbff 0%, #f3f7ff 58%, #e8f0ff 100%);
}

.layout-cover::before {
  width: 14px;
}

.cover-grid {
  display: grid;
  grid-template-columns: 1.02fr 0.98fr;
  flex: 1;
  align-items: center;
  gap: 92px;
}

.cover-copy .slide-kicker {
  margin-bottom: 38px;
}

.cover-copy .slide-title {
  max-width: 690px;
  font-size: 83px;
  line-height: 0.99;
}

.cover-copy .slide-title .accent {
  color: var(--blue);
}

.cover-lines {
  display: grid;
  gap: 8px;
  margin-top: 36px;
  color: #40516a;
  font-size: 23px;
  line-height: 1.45;
}

.cover-meta {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-top: 50px;
  color: #4c5d75;
  font-size: 16px;
}

.cover-meta strong {
  color: var(--ink);
  font-size: 21px;
}

.question-visual {
  position: relative;
  display: grid;
  min-height: 560px;
  place-items: center;
}

.question-visual::before,
.question-visual::after {
  position: absolute;
  border: 1px solid rgba(30, 91, 216, 0.2);
  border-radius: 50%;
  content: "";
}

.question-visual::before {
  width: 540px;
  height: 540px;
}

.question-visual::after {
  width: 390px;
  height: 390px;
}

.question-panel {
  position: relative;
  z-index: 2;
  width: 470px;
  padding: 56px 46px 44px;
  border: 1px solid rgba(30, 91, 216, 0.23);
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.91);
  box-shadow: 0 30px 80px rgba(22, 54, 111, 0.18);
  transform: rotate(1.8deg);
}

.question-panel .big-number {
  color: var(--blue);
  font-size: 118px;
  font-weight: 900;
  line-height: 0.9;
}

.question-panel .question {
  margin-top: 30px;
  color: var(--ink);
  font-size: 35px;
  font-weight: 850;
  letter-spacing: -0.035em;
  line-height: 1.3;
  white-space: pre-line;
  word-break: keep-all;
}

.question-panel .caption {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

/* Problem */
.problem-grid {
  display: grid;
  grid-template-columns: 0.88fr 1.25fr;
  height: 100%;
  gap: 75px;
}

.problem-points {
  align-self: end;
  padding: 28px 0 12px;
  border-top: 2px solid var(--ink);
}

.comparison-visual {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 74px 1fr;
  align-items: center;
  height: 100%;
}

.comparison-column {
  min-height: 340px;
  padding: 38px;
  border-top: 7px solid var(--blue);
  background: var(--white);
  box-shadow: 0 18px 50px rgba(16, 47, 95, 0.1);
}

.comparison-column:last-child {
  border-color: var(--red);
}

.comparison-column h3 {
  margin: 0 0 35px;
  font-size: 27px;
}

.comparison-column ul {
  display: grid;
  gap: 22px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.comparison-column li {
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  color: #324158;
  font-size: 32px;
  font-weight: 700;
}

.comparison-gap {
  color: #8291a6;
  font-size: 46px;
  font-weight: 900;
  text-align: center;
}

.comparison-visual .caption {
  position: absolute;
  right: 0;
  bottom: 4px;
  left: 0;
  text-align: center;
}

/* Stakes */
.stakes-layout {
  display: grid;
  grid-template-rows: 1fr auto;
  height: 100%;
}

.stakes-words {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-items: center;
  gap: 42px;
}

.stakes-word {
  position: relative;
  padding: 28px 20px 28px 0;
  border-bottom: 2px solid var(--line);
}

.stakes-word .ordinal {
  color: var(--blue);
  font-family: var(--font-mono);
  font-size: 15px;
}

.stakes-word strong {
  display: block;
  margin-top: 18px;
  font-size: 42px;
  line-height: 1.15;
  word-break: keep-all;
}

.stakes-word:not(:last-child)::after {
  position: absolute;
  top: 50%;
  right: -30px;
  color: #9badc4;
  font-size: 38px;
  content: "›";
}

.sequence-line {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin-top: 35px;
  border-top: 1px solid var(--line);
}

.sequence-item {
  position: relative;
  padding: 24px 18px 10px 28px;
  color: #314057;
  font-size: 17px;
  font-weight: 750;
}

.sequence-item::before {
  position: absolute;
  top: -7px;
  left: 0;
  width: 13px;
  height: 13px;
  border: 3px solid var(--paper);
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 0 1px var(--blue);
  content: "";
}

.sequence-caption {
  grid-column: 1 / -1;
  margin-top: 18px;
  color: #7d5600;
  font-size: 15px;
}

/* Position */
.boundary-layout {
  display: grid;
  grid-template-rows: 1fr auto;
  height: 100%;
  gap: 30px;
}

.boundary-line {
  display: grid;
  grid-template-columns: 1fr 1.05fr 1fr;
  align-items: stretch;
  min-height: 300px;
  border-top: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
}

.boundary-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 34px 42px;
}

.boundary-block + .boundary-block {
  border-left: 1px solid var(--line);
}

.boundary-block.middle {
  background: var(--blue-pale);
  color: var(--blue-deep);
}

.boundary-block .label {
  color: var(--muted);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.boundary-block strong {
  margin-top: 20px;
  font-size: 33px;
  line-height: 1.25;
  word-break: keep-all;
}

.boundary-notes {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 32px;
}

.boundary-notes p {
  margin: 0;
  padding-top: 18px;
  border-top: 4px solid var(--blue);
  color: #3c4a5e;
  font-size: 17px;
  line-height: 1.55;
}

/* Flow */
.flow-layout {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  gap: 34px;
}

.workflow-track {
  position: relative;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
}

.workflow-track::before {
  position: absolute;
  top: 37px;
  right: 7%;
  left: 7%;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), #77a4ff);
  content: "";
}

.workflow-step {
  position: relative;
  z-index: 1;
  text-align: center;
}

.workflow-step .node {
  display: grid;
  width: 76px;
  height: 76px;
  margin: auto;
  place-items: center;
  border: 5px solid var(--paper);
  border-radius: 50%;
  background: var(--blue);
  color: white;
  box-shadow: 0 0 0 2px var(--blue);
  font: 800 16px var(--font-mono);
}

.workflow-step strong {
  display: block;
  margin-top: 15px;
  font-size: 19px;
}

.flow-lower {
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  gap: 54px;
}

.record-sheet {
  padding: 30px 34px;
  border-left: 6px solid var(--blue);
  background: #0d1e38;
  color: #edf4ff;
  box-shadow: 0 18px 45px rgba(11, 29, 58, 0.16);
}

.record-sheet .eyebrow {
  color: #8eb5ff;
}

.record-field {
  display: grid;
  grid-template-columns: 95px 1fr;
  gap: 18px;
  padding: 15px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 18px;
}

.record-field span:first-child {
  color: #99aac2;
}

.reuse-list {
  display: grid;
  align-content: start;
  gap: 20px;
}

.reuse-item {
  padding: 20px 0 18px;
  border-bottom: 1px solid var(--line);
  color: #26354a;
  font-size: 20px;
  font-weight: 750;
}

.reuse-item::before {
  display: inline-grid;
  width: 31px;
  height: 31px;
  margin-right: 13px;
  place-items: center;
  border-radius: 50%;
  background: var(--blue-pale);
  color: var(--blue);
  font: 850 13px var(--font-mono);
  content: attr(data-index);
}

.flow-caption {
  margin-top: 14px;
  padding: 12px 15px;
  background: var(--yellow-pale);
  color: #735600;
  font-size: 14px;
  line-height: 1.45;
}

/* OCR */
.ocr-layout {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  height: 100%;
  gap: 52px;
}

.parser-table {
  align-self: stretch;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: white;
  box-shadow: 0 14px 38px rgba(20, 52, 98, 0.08);
}

.parser-row {
  display: grid;
  grid-template-columns: 1.24fr 0.92fr 0.84fr;
  align-items: center;
  min-height: 88px;
  padding: 0 25px;
  border-bottom: 1px solid var(--line);
}

.parser-row:last-child {
  border-bottom: 0;
}

.parser-row.header {
  min-height: 48px;
  background: #f1f5fb;
  color: #617188;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 0.08em;
}

.parser-row code {
  color: #16253a;
  font: 700 25px var(--font-mono);
}

.parser-row .normalized {
  color: var(--blue);
  font: 750 24px var(--font-mono);
}

.parser-row .reason {
  color: #5f6f85;
  font-size: 22px;
}

.meaning-gate {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 8px 0;
}

.meaning-gate .gate-title {
  max-width: 380px;
  font-size: 36px;
  font-weight: 900;
  line-height: 1.23;
  word-break: keep-all;
}

.gate-list {
  display: grid;
  gap: 10px;
  margin-top: 25px;
}

.gate-item {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 12px;
  align-items: center;
  color: #34445b;
  font-size: 24px;
}

.gate-item::before {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 8px;
  background: var(--blue-pale);
  color: var(--blue);
  font-weight: 900;
  content: "✓";
}

.partial-date {
  padding: 23px 25px;
  border: 1px solid #e6c663;
  background: var(--yellow-pale);
  color: #6c5100;
  font-size: 17px;
  line-height: 1.55;
}

/* Strategy */
.strategy-layout {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  align-items: center;
  height: 100%;
  gap: 64px;
}

.branch-diagram {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 26px 56px;
  min-height: 360px;
}

.branch-node {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 145px;
  padding: 25px 28px;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: white;
}

.branch-node strong {
  font-size: 24px;
}

.branch-node span {
  margin-top: 10px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.45;
}

.branch-node.base {
  grid-row: 1 / 3;
  align-self: center;
  border-color: var(--blue);
  background: var(--blue-deep);
  color: white;
}

.branch-node.base span {
  color: #b9cdf5;
}

.branch-node.decision {
  grid-row: 1 / 3;
  grid-column: 2;
  align-self: center;
  border-radius: 80px;
  background: var(--blue-pale);
  text-align: center;
}

.branch-node.accept {
  grid-column: 3;
  border-color: #78cbb2;
  background: var(--green-pale);
}

.branch-node.rescue {
  grid-column: 3;
  border-color: #efc759;
  background: var(--yellow-pale);
}

.branch-arrow {
  position: absolute;
  color: #8aa0bf;
  font-size: 34px;
  font-weight: 900;
}

.branch-arrow.one {
  top: 46%;
  left: 31%;
}

.branch-arrow.two {
  top: 21%;
  left: 66%;
}

.branch-arrow.three {
  top: 70%;
  left: 66%;
}

.measurement-scope {
  padding-left: 38px;
  border-left: 3px solid var(--blue);
}

.measurement-scope h3 {
  margin: 0 0 25px;
  font-size: 30px;
}

.measurement-row {
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.measurement-row strong {
  display: block;
  font-size: 20px;
}

.measurement-row span {
  display: block;
  margin-top: 7px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.45;
}

/* Recall */
.recall-layout {
  display: grid;
  grid-template-columns: 0.83fr 1.17fr;
  height: 100%;
  gap: 55px;
}

.range-summary {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 38px 42px;
  border-left: 8px solid var(--red);
  background: var(--red-pale);
}

.range-summary .inputs {
  color: #6f3a42;
  font-size: 17px;
  line-height: 1.55;
}

.range-summary .range-number {
  margin: 38px 0 20px;
  color: var(--red);
  font-size: 92px;
  font-weight: 900;
  letter-spacing: -0.06em;
  line-height: 0.9;
}

.range-summary .range-number small {
  margin-left: 10px;
  color: #59323a;
  font-size: 26px;
}

.range-summary code {
  display: block;
  padding-top: 18px;
  border-top: 1px solid rgba(229, 72, 77, 0.25);
  color: #723c43;
  font: 700 15px/1.7 var(--font-mono);
}

.range-plot {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.range-axis {
  position: relative;
  height: 120px;
  margin: 40px 25px 20px;
}

.range-axis .baseline {
  position: absolute;
  top: 61px;
  right: 0;
  left: 0;
  height: 8px;
  border-radius: 8px;
  background: #dde5ef;
}

.range-axis .active-range {
  position: absolute;
  top: 54px;
  left: 50%;
  width: 50%;
  height: 22px;
  border-radius: 20px;
  background: linear-gradient(90deg, #f38c90, var(--red));
}

.range-tick {
  position: absolute;
  top: 85px;
  transform: translateX(-50%);
  color: #64748b;
  font: 700 16px var(--font-mono);
}

.range-marker {
  position: absolute;
  top: 20px;
  transform: translateX(-50%);
  color: var(--red);
  font-size: 16px;
  font-weight: 850;
  white-space: nowrap;
}

.range-assumptions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 20px;
}

.range-assumption {
  padding-top: 17px;
  border-top: 3px solid var(--line);
  color: #435168;
  font-size: 15px;
  line-height: 1.45;
}

/* Returns */
.returns-layout {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  gap: 34px;
}

.window-timeline {
  position: relative;
  padding: 27px 32px 38px;
  border: 1px solid var(--line);
  background: white;
}

.window-head {
  display: flex;
  justify-content: space-between;
  color: #495970;
  font-size: 15px;
}

.window-head strong {
  color: var(--ink);
  font-size: 18px;
}

.window-line {
  position: relative;
  height: 62px;
  margin-top: 15px;
}

.window-line::before {
  position: absolute;
  top: 30px;
  right: 0;
  left: 0;
  height: 5px;
  background: #dce5f1;
  content: "";
}

.window-active {
  position: absolute;
  top: 25px;
  right: 0;
  left: 43%;
  height: 15px;
  border-radius: 15px;
  background: #66c6a7;
}

.window-now,
.window-open,
.window-expiry {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  font: 750 13px var(--font-mono);
  white-space: nowrap;
}

.window-now {
  left: 5%;
  color: #b87900;
}

.window-open {
  left: 43%;
  color: #087655;
}

.window-expiry {
  right: 0;
  transform: none;
  color: #087655;
}

.returns-lower {
  display: grid;
  grid-template-columns: 0.86fr 1.14fr;
  gap: 45px;
}

.return-states {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.return-state {
  padding: 20px 22px;
  border-left: 5px solid var(--blue);
  background: white;
}

.return-state strong {
  display: block;
  font-size: 18px;
}

.return-state code {
  display: block;
  margin-top: 9px;
  color: #6c7b90;
  font: 700 12px/1.45 var(--font-mono);
}

.return-state.hold {
  border-color: var(--yellow);
  background: var(--yellow-pale);
}

.comparison-limit {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 34px 38px;
  border: 2px solid var(--blue);
  background: var(--blue-pale);
}

.comparison-limit h3 {
  margin: 0 0 18px;
  color: var(--blue-deep);
  font-size: 28px;
}

.comparison-limit p {
  margin: 0;
  color: #3d557c;
  font-size: 19px;
  line-height: 1.6;
}

.comparison-limit .caption {
  margin-top: 22px;
  padding-top: 17px;
  border-top: 1px solid #bfd1f4;
}

/* Demo */
.layout-demo {
  background:
    radial-gradient(circle at 10% 0%, rgba(30, 91, 216, 0.12), transparent 28%),
    var(--paper);
}

.demo-ribbon {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding: 12px 16px;
  background: var(--yellow-pale);
  color: #684e00;
  font-size: 14px;
  font-weight: 800;
}

.demo-layout {
  display: grid;
  grid-template-columns: 0.72fr 1.28fr;
  min-height: 0;
  height: calc(100% - 58px);
  gap: 36px;
}

.demo-steps {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 13px;
}

.demo-step {
  display: grid;
  grid-template-columns: 42px 1fr;
  align-items: center;
  gap: 14px;
  padding: 16px 17px;
  border-left: 4px solid #cad5e4;
  color: #69778b;
  transition: 240ms ease;
}

.demo-step .step-number {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border-radius: 50%;
  background: #e9eef5;
  font: 800 12px var(--font-mono);
}

.demo-step strong {
  font-size: 18px;
}

.demo-step.is-active {
  border-left-color: var(--blue);
  background: var(--blue-pale);
  color: var(--blue-deep);
  transform: translateX(8px);
}

.demo-step.is-complete {
  border-left-color: var(--green);
  color: #234989;
}

.demo-step.is-active .step-number {
  background: var(--blue);
  color: white;
}

.demo-workbench {
  position: relative;
  overflow: hidden;
  border: 1px solid #cbd8e9;
  border-radius: 22px;
  background: white;
  box-shadow: 0 17px 46px rgba(17, 50, 100, 0.12);
}

.workbench-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 54px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  background: #f5f8fd;
  color: #526177;
  font-size: 13px;
  font-weight: 800;
}

.demo-pane {
  display: none;
  height: calc(100% - 54px);
  padding: 28px 30px;
}

.demo-pane.is-active {
  display: grid;
  animation: pane-in 320ms ease both;
}

.raw-snippet {
  align-self: center;
  padding: 34px;
  border-left: 6px solid var(--blue);
  background: #101e34;
  color: #eef4ff;
  font: 700 32px/1.8 var(--font-mono);
  white-space: pre-line;
}

.raw-snippet small {
  display: block;
  margin-bottom: 14px;
  color: #89aff4;
  font: 800 12px var(--font-sans);
  letter-spacing: 0.12em;
}

.confirmation-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-content: center;
  gap: 16px;
}

.fake-field {
  padding: 15px 17px;
  border: 1px solid #cbd7e7;
  border-radius: 9px;
  background: #fbfdff;
}

.fake-field span {
  display: block;
  color: #6d7c90;
  font-size: 12px;
}

.fake-field strong {
  display: block;
  margin-top: 7px;
  font-size: 25px;
}

.confirmation-note {
  grid-column: 1 / -1;
  padding: 15px 17px;
  background: var(--green-pale);
  color: #234989;
  font-size: 15px;
  font-weight: 750;
}

.saved-record {
  align-self: center;
  padding: 28px 32px;
  border: 2px solid var(--green);
  background: var(--green-pale);
}

.saved-record h3 {
  margin: 0 0 20px;
  color: #234989;
  font-size: 28px;
}

.saved-record dl {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px 20px;
  margin: 0;
}

.saved-record dt {
  color: #536a91;
  font-size: 14px;
}

.saved-record dd {
  margin: 0;
  color: #243d67;
  font-size: 23px;
  font-weight: 750;
}

.result-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-content: center;
  gap: 18px;
}

.result-box {
  min-height: 175px;
  padding: 24px;
  border-top: 6px solid var(--blue);
  background: var(--blue-pale);
}

.result-box.hold {
  border-color: var(--yellow);
  background: var(--yellow-pale);
}

.result-box .code {
  font: 800 13px var(--font-mono);
}

.result-box strong {
  display: block;
  margin-top: 20px;
  font-size: 29px;
}

.result-box p {
  margin: 10px 0 0;
  color: #536178;
  font-size: 22px;
  line-height: 1.45;
}

.demo-controls {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 13px;
}

.demo-control {
  min-height: 38px;
  padding: 0 14px;
  border-radius: 8px;
  background: var(--blue-pale);
  color: var(--blue-deep);
  font-size: 13px;
  font-weight: 800;
}

.demo-control.primary {
  background: var(--blue);
  color: white;
}

/* Closing */
.closing-layout {
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  align-items: center;
  height: 100%;
  gap: 70px;
}

.closing-points {
  padding-top: 25px;
  border-top: 4px solid var(--blue);
}

.closing-question {
  position: relative;
  padding: 52px;
  border: 2px solid var(--blue);
  background: var(--blue-deep);
  color: white;
}

.closing-question::after {
  position: absolute;
  right: -22px;
  bottom: -22px;
  width: 90px;
  height: 90px;
  border-right: 10px solid var(--yellow);
  border-bottom: 10px solid var(--yellow);
  content: "";
}

.closing-question .question {
  font-size: 40px;
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1.3;
  white-space: pre-line;
  word-break: keep-all;
}

.closing-question .caption {
  margin-top: 35px;
  color: #b9cbed;
}

/* Chrome */
.controlbar {
  justify-content: space-between;
  gap: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.slide-position {
  min-width: 76px;
  color: #9eb0c9;
  font: 700 12px var(--font-mono);
  text-align: center;
}

.progress-track {
  position: relative;
  flex: 1;
  max-width: 530px;
  height: 5px;
  overflow: hidden;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.14);
}

.progress-bar,
.time-bar {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
}

.progress-bar {
  background: #76a2ff;
}

.time-bar {
  background: var(--yellow);
  opacity: 0.72;
}

.time-display {
  min-width: 115px;
  color: #9fb0c8;
  font: 700 12px var(--font-mono);
}

.overlay {
  position: fixed;
  z-index: 80;
  inset: 58px 0 68px;
  display: none;
  overflow: auto;
  padding: 38px;
  background: rgba(4, 10, 19, 0.82);
  backdrop-filter: blur(12px);
}

.overlay.is-open {
  display: block;
}

.overlay-panel {
  width: min(960px, 100%);
  margin: 0 auto;
  padding: 34px;
  border: 1px solid #d8e2f0;
  border-radius: 18px;
  background: #f9fbff;
  box-shadow: var(--shadow);
}

.overlay-head {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}

.overlay-head h2 {
  margin: 0;
  font-size: 28px;
}

.overlay-close {
  min-width: 42px;
  min-height: 42px;
  border-radius: 9px;
  background: #e8eef7;
  color: #1e334f;
  font-size: 20px;
}

.toc-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.toc-button {
  display: grid;
  grid-template-columns: 42px 1fr auto;
  width: 100%;
  min-height: 64px;
  align-items: center;
  gap: 13px;
  padding: 12px 15px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: var(--ink);
  text-align: left;
}

.toc-button:hover,
.toc-button[aria-current="page"] {
  border-color: #80a8f1;
  background: var(--blue-pale);
}

.toc-number {
  color: var(--blue);
  font: 800 13px var(--font-mono);
}

.toc-title {
  overflow: hidden;
  font-size: 14px;
  font-weight: 800;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.toc-duration {
  color: var(--muted);
  font: 700 11px var(--font-mono);
}

.notes-panel {
  color: #1c2a3d;
}

.notes-script {
  white-space: pre-line;
  color: #27384f;
  font-size: 17px;
  line-height: 1.78;
}

.notes-cue,
.notes-correction {
  margin-top: 22px;
  padding: 17px 19px;
  border-left: 5px solid var(--yellow);
  background: var(--yellow-pale);
  color: #654c00;
  font-size: 14px;
  line-height: 1.55;
}

.notes-correction {
  border-color: var(--blue);
  background: var(--blue-pale);
  color: #25446e;
}

.source-list {
  display: grid;
  gap: 12px;
  margin: 24px 0 0;
  padding: 24px 0 0;
  border-top: 1px solid var(--line);
  list-style: none;
}

.source-item a,
.source-item strong {
  color: var(--blue-deep);
  font-size: 14px;
}

.source-item p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.error-screen {
  display: grid;
  width: 100%;
  height: 100%;
  place-items: center;
  padding: 40px;
  background: #f8fbff;
  color: #26364b;
  text-align: center;
}

.error-screen h1 {
  margin: 0 0 18px;
  color: #a52c35;
  font-size: 32px;
}

.error-screen p {
  max-width: 760px;
  margin: 0;
  font-size: 16px;
  line-height: 1.65;
}

@keyframes pane-in {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

@media (max-width: 760px) {
  body {
    overflow: auto;
    background: var(--paper);
  }

  .presentation {
    min-height: 100%;
    height: auto;
    grid-template-rows: 54px auto 62px;
  }

  .appbar,
  .controlbar {
    position: sticky;
    z-index: 50;
    padding: 0 10px;
  }

  .appbar {
    top: 0;
  }

  .brand span,
  #fullscreen-button,
  #notes-button .wide-label,
  .time-display,
  .progress-track {
    display: none;
  }

  .chrome-button {
    min-width: 42px;
    min-height: 38px;
    padding: 0 10px;
  }

  .viewport {
    position: relative;
    overflow: visible;
    min-height: calc(100vh - 116px);
    background: var(--paper);
  }

  .stage-wrap {
    position: relative;
    top: auto;
    left: auto;
    width: 100% !important;
    height: auto !important;
    transform: none;
  }

  .stage {
    position: relative;
    width: 100%;
    height: auto;
    min-height: calc(100vh - 116px);
    overflow: visible;
    transform: none !important;
    box-shadow: none;
  }

  .slide {
    position: relative;
    min-height: calc(100vh - 116px);
    overflow: visible;
    padding: 28px 20px 38px;
    background-size: 44px 44px, 44px 44px, auto, auto;
  }

  .slide::before {
    width: 5px;
  }

  .slide-topline {
    margin-bottom: 14px;
  }

  .slide-kicker {
    font-size: 13px;
  }

  .source-count {
    font-size: 10px;
  }

  .slide-title {
    font-size: clamp(31px, 9vw, 42px);
    line-height: 1.12;
  }

  .slide-body {
    margin-top: 24px;
  }

  .slide-footer {
    margin-top: 28px;
  }

  .body-points li {
    font-size: 16px;
  }

  .cover-grid,
  .problem-grid,
  .flow-lower,
  .ocr-layout,
  .strategy-layout,
  .recall-layout,
  .returns-lower,
  .closing-layout,
  .demo-layout {
    display: block;
  }

  .layout-cover {
    padding: 34px 22px 42px;
  }

  .cover-copy .slide-kicker {
    margin-bottom: 25px;
  }

  .cover-copy .slide-title {
    font-size: clamp(46px, 14vw, 66px);
  }

  .cover-lines {
    margin-top: 25px;
    font-size: 18px;
  }

  .cover-meta {
    margin-top: 28px;
  }

  .question-visual {
    min-height: 0;
    margin-top: 34px;
  }

  .question-visual::before,
  .question-visual::after {
    display: none;
  }

  .question-panel {
    width: 100%;
    padding: 30px 26px;
    transform: none;
  }

  .question-panel .big-number {
    font-size: 76px;
  }

  .question-panel .question {
    font-size: 25px;
  }

  .problem-points {
    margin-bottom: 26px;
  }

  .comparison-visual {
    display: grid;
    grid-template-columns: 1fr;
    height: auto;
    gap: 12px;
  }

  .comparison-column {
    min-height: 0;
    padding: 24px;
  }

  .comparison-column h3 {
    margin-bottom: 18px;
    font-size: 21px;
  }

  .comparison-column ul {
    gap: 12px;
  }

  .comparison-column li {
    padding-bottom: 12px;
    font-size: 17px;
  }

  .comparison-gap {
    transform: rotate(90deg);
    font-size: 28px;
  }

  .comparison-visual .caption {
    position: static;
    margin-top: 10px;
  }

  .stakes-words,
  .sequence-line,
  .boundary-line,
  .boundary-notes,
  .workflow-track,
  .range-assumptions,
  .return-states,
  .result-pair,
  .toc-list {
    grid-template-columns: 1fr;
  }

  .stakes-word:not(:last-child)::after,
  .workflow-track::before {
    display: none;
  }

  .stakes-word strong {
    font-size: 29px;
  }

  .sequence-line {
    border-top: 0;
  }

  .sequence-item {
    border-left: 1px solid var(--line);
  }

  .sequence-item::before {
    top: 25px;
    left: -7px;
  }

  .boundary-line {
    min-height: 0;
  }

  .boundary-block + .boundary-block {
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .boundary-block {
    padding: 24px;
  }

  .boundary-block strong {
    margin-top: 11px;
    font-size: 24px;
  }

  .boundary-notes {
    margin-top: 22px;
  }

  .workflow-track {
    gap: 8px;
  }

  .workflow-step {
    display: grid;
    grid-template-columns: 46px 1fr;
    align-items: center;
    text-align: left;
  }

  .workflow-step .node {
    width: 42px;
    height: 42px;
    margin: 0;
    border-width: 3px;
    font-size: 11px;
  }

  .workflow-step strong {
    margin: 0;
    font-size: 16px;
  }

  .record-sheet,
  .reuse-list,
  .parser-table,
  .meaning-gate,
  .measurement-scope,
  .range-summary,
  .range-plot,
  .return-states,
  .comparison-limit,
  .closing-points,
  .closing-question,
  .demo-steps,
  .demo-workbench {
    margin-top: 24px;
  }

  .record-field {
    grid-template-columns: 76px 1fr;
    font-size: 15px;
  }

  .parser-row {
    grid-template-columns: 1fr;
    gap: 7px;
    padding: 17px;
  }

  .parser-row.header {
    display: none;
  }

  .parser-row code,
  .parser-row .normalized {
    font-size: 15px;
  }

  .meaning-gate .gate-title {
    font-size: 28px;
  }

  .branch-diagram {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto;
    min-height: 0;
    gap: 12px;
  }

  .branch-node.base,
  .branch-node.decision,
  .branch-node.accept,
  .branch-node.rescue {
    grid-row: auto;
    grid-column: auto;
  }

  .branch-node {
    min-height: 0;
    padding: 21px;
    border-radius: 14px;
  }

  .branch-node.decision {
    border-radius: 14px;
  }

  .branch-arrow {
    display: none;
  }

  .measurement-scope {
    padding-left: 20px;
  }

  .range-summary {
    padding: 28px;
  }

  .range-summary .range-number {
    font-size: 68px;
  }

  .range-axis {
    margin-right: 10px;
    margin-left: 10px;
  }

  .window-timeline {
    padding: 20px 16px 29px;
  }

  .window-head {
    display: block;
  }

  .window-head span {
    display: block;
    margin-top: 8px;

  function renderSlide() {
    const slide = state.deck.slides[state.index];
    state.demoStep = 0;
    clearTimeout(state.demoTimer);
    const article = slide.layout === "cover" ? renderCover(slide, state.index) : renderStandard(slide, state.index);
    article.setAttribute("role", "group");

    article.setAttribute("aria-label", `${state.index + 1} / ${state.deck.slides.length}: ${slide.title.replace(/\n/g, " ")}`);
    dom.stage.replaceChildren(article);
    requestAnimationFrame(() => article.classList.add("is-ready"));
    updateControls();
    updateNotes();
    updateTocCurrent();
    fitStage();
  }

  function updateDemoView() {
    const steps = dom.stage.querySelectorAll("[data-demo-step]");
    const panes = dom.stage.querySelectorAll("[data-demo-pane]");
    steps.forEach((item, index) => {
      item.classList.toggle("is-active", index === state.demoStep);
      item.classList.toggle("is-complete", index < state.demoStep);
      item.setAttribute("aria-current", index === state.demoStep ? "step" : "false");
    });
    panes.forEach((item, index) => {
      const active = index === state.demoStep;
      item.classList.toggle("is-active", active);
      item.setAttribute("aria-hidden", active ? "false" : "true");
    });
    const current = steps[state.demoStep];
    const live = dom.stage.querySelector(".demo-live");
    if (current && live) {
      const title = current.querySelector("strong");
      live.textContent = `시연 단계 ${state.demoStep + 1}/${steps.length}: ${title ? title.textContent : ""}`;
    }
    const previous = dom.stage.querySelector('[data-demo-action="previous"]');
    const next = dom.stage.querySelector('[data-demo-action="next"]');
    if (previous) previous.disabled = state.demoStep === 0;
    if (next) next.disabled = state.demoStep === Math.max(0, panes.length - 1);
  }

  function playDemoSequence() {
    clearTimeout(state.demoTimer);
    state.demoStep = 0;
    updateDemoView();
    const advance = () => {
      const lastStep = Math.max(0, dom.stage.querySelectorAll("[data-demo-step]").length - 1);
      if (state.demoStep >= lastStep || state.deck.slides[state.index].id !== "demo") return;
      state.demoStep += 1;
      updateDemoView();
      state.demoTimer = window.setTimeout(advance, state.reducedMotion ? 50 : 1350);
    };
    state.demoTimer = window.setTimeout(advance, state.reducedMotion ? 50 : 1350);
  }

  function slideSecondsBefore(index) {
    return state.deck.slides.slice(0, index).reduce((sum, slide) => sum + finiteNumber(slide.duration, 0), 0);
  }

  function totalDuration() {
    return state.deck.slides.reduce((sum, slide) => sum + finiteNumber(slide.duration, 0), 0);
  }

  function updateControls() {
    const count = state.deck.slides.length;
    const slide = state.deck.slides[state.index];
    const total = totalDuration();
    const absolute = slideSecondsBefore(state.index) + state.slideElapsed;
    dom.position.textContent = `${String(state.index + 1).padStart(2, "0")} / ${String(count).padStart(2, "0")}`;
    dom.elapsed.textContent = `${formatClock(absolute)} / ${formatClock(total)}`;
    dom.progress.style.width = `${(state.index + 1) / count * 100}%`;
    dom.timeProgress.style.width = `${Math.min(100, absolute / Math.max(1, total) * 100)}%`;
    dom.prev.disabled = state.index === 0;
    dom.next.disabled = state.index === count - 1;
    dom.play.textContent = state.playing ? "일시정지" : "재생";
    dom.play.setAttribute("aria-pressed", state.playing ? "true" : "false");
    document.title = `${slide.number || String(state.index)} ${slide.title.replace(/\n/g, " ")} · ITDA`;
  }

  function updateNotes() {
    const slide = state.deck.slides[state.index];
    dom.notesTitle.textContent = `${slide.number} ${slide.title.replace(/\n/g, " ")}`;
    dom.notesScript.textContent = slide.script || "발표자 노트가 없습니다.";
    dom.notesCue.textContent = slide.cue ? `발표 큐 · ${slide.cue}` : "";
    dom.notesCue.hidden = !slide.cue;
    dom.notesCorrection.textContent = slide.screenCorrection ? `화면 정정 원칙 · ${slide.screenCorrection}` : "";
    dom.notesCorrection.hidden = !slide.screenCorrection;
    dom.sourceList.replaceChildren();
    safeArray(slide.sourceRefs).forEach((ref) => {
      const source = state.deck.sources && state.deck.sources[ref];
      if (!source) return;
      const item = element("li", "source-item");
      const url = cleanText(source.url, "");
      if (/^https:\/\//i.test(url)) {
        const link = element("a", "", source.title || ref);
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        item.appendChild(link);
      } else {
        item.appendChild(element("strong", "", source.title || ref));
      }
      item.appendChild(element("p", "", source.detail || ""));
      dom.sourceList.appendChild(item);
    });
  }

  function buildToc() {
    dom.tocList.replaceChildren();
    state.deck.slides.forEach((slide, index) => {
      const item = element("li");
      const button = element("button", "toc-button");
      button.type = "button";
      button.dataset.slideIndex = String(index);
      button.appendChild(element("span", "toc-number", slide.number));
      button.appendChild(element("span", "toc-title", slide.title.replace(/\n/g, " ")));
      button.appendChild(element("span", "toc-duration", `${slide.duration}초`));
      item.appendChild(button);
      dom.tocList.appendChild(item);
    });
  }

  function updateTocCurrent() {
    dom.tocList.querySelectorAll("[data-slide-index]").forEach((button) => {
      button.setAttribute("aria-current", Number(button.dataset.slideIndex) === state.index ? "page" : "false");
    });
  }

  function setHash(slide) {
    const hash = `#${encodeURIComponent(slide.id)}`;
    // Streamlit embeds the document as about:srcdoc, where history mutation
    // is prohibited. Navigation must still work without a deep-link URL.
    if (location.protocol === "about:") return;
    if (location.hash !== hash) {
      try { history.replaceState(null, "", hash); } catch (_) { /* optional URL sync */ }
    }
  }

  function goTo(index, options) {
    const config = Object.assign({ keepPlaying: false, updateHash: true }, options || {});
    const nextIndex = Math.max(0, Math.min(state.deck.slides.length - 1, Number(index)));
    if (!config.keepPlaying) pause();
    state.index = nextIndex;
    state.slideElapsed = 0;
    if (config.updateHash) setHash(state.deck.slides[state.index]);
    renderSlide();
  }

  function initialIndexFromHash() {
    let id = "";
    try { id = decodeURIComponent(location.hash.replace(/^#/, "")); } catch (_) { return 0; }
    if (!id) return 0;
    const index = state.deck.slides.findIndex((slide) => slide.id === id || slide.number === id);
    return index >= 0 ? index : 0;
  }

  function pause() {
    state.playing = false;
    state.lastFrame = 0;
    if (state.raf) cancelAnimationFrame(state.raf);
    state.raf = 0;
    updateControls();
  }

  function togglePlay() {
    if (state.playing) {
      pause();
      return;
    }
    if (state.index === state.deck.slides.length - 1 && state.slideElapsed >= state.deck.slides[state.index].duration) {
      goTo(0, { keepPlaying: true });
    }
    state.playing = true;
    state.lastFrame = performance.now();
    updateControls();
    state.raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    if (!state.playing) return;
    const delta = Math.min(0.2, Math.max(0, (now - state.lastFrame) / 1000));
    state.lastFrame = now;
    state.slideElapsed += delta;
    const slide = state.deck.slides[state.index];

    if (slide.id === "demo") {
      const stepCount = Math.max(1, dom.stage.querySelectorAll("[data-demo-step]").length);
      const step = Math.min(stepCount - 1, Math.floor(state.slideElapsed / Math.max(1, slide.duration / stepCount)));
      if (step !== state.demoStep) {
        state.demoStep = step;
        updateDemoView();
      }
    }

    if (state.slideElapsed >= slide.duration) {
      const carry = state.slideElapsed - slide.duration;
      if (state.index >= state.deck.slides.length - 1) {
        state.slideElapsed = slide.duration;
        pause();
        return;
      }
      state.index += 1;
      state.slideElapsed = carry;
      setHash(state.deck.slides[state.index]);
      renderSlide();
    } else {
      updateControls();
    }
    state.raf = requestAnimationFrame(tick);
  }

  function fitStage() {
    if (!state.deck) return;
    const mobile = window.innerWidth <= MOBILE_BREAKPOINT;
    document.body.classList.toggle("reader-mode", mobile);
    if (mobile) {
      dom.stage.style.transform = "none";
      dom.stageWrap.style.width = "100%";
      dom.stageWrap.style.height = "auto";
      return;
    }
    const availableWidth = Math.max(320, dom.viewport.clientWidth - 32);
    const availableHeight = Math.max(180, dom.viewport.clientHeight - 28);
    const scale = Math.min(availableWidth / DESIGN_WIDTH, availableHeight / DESIGN_HEIGHT);
    dom.stage.style.transform = `scale(${scale})`;
    dom.stageWrap.style.width = `${DESIGN_WIDTH * scale}px`;
    dom.stageWrap.style.height = `${DESIGN_HEIGHT * scale}px`;
  }

  function openOverlay(overlay) {
    const opener = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    closeOverlays(false);
    state.modalReturnFocus = opener;
    dom.presentation.inert = true;
    dom.presentation.setAttribute("aria-hidden", "true");
    overlay.classList.add("is-open");
    overlay.setAttribute("aria-hidden", "false");
    const focusable = overlay.querySelector("button, a[href]");
    if (focusable) focusable.focus();
  }

  function closeOverlays(restoreFocus = true) {
    [dom.tocOverlay, dom.notesOverlay].forEach((overlay) => {
      overlay.classList.remove("is-open");
      overlay.setAttribute("aria-hidden", "true");
    });
    dom.presentation.inert = false;
    dom.presentation.removeAttribute("aria-hidden");
    if (restoreFocus && state.modalReturnFocus && state.modalReturnFocus.isConnected) {
      state.modalReturnFocus.focus();
    }
    if (restoreFocus) state.modalReturnFocus = null;
  }

  function isOverlayOpen() {
    return dom.tocOverlay.classList.contains("is-open") || dom.notesOverlay.classList.contains("is-open");
  }

  function currentOverlay() {
    if (dom.tocOverlay.classList.contains("is-open")) return dom.tocOverlay;
    if (dom.notesOverlay.classList.contains("is-open")) return dom.notesOverlay;
    return null;
  }

  function trapModalFocus(event) {
    const overlay = currentOverlay();
    if (!overlay || event.key !== "Tab") return false;
    const focusable = Array.from(overlay.querySelectorAll('button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'))
      .filter((item) => !item.hasAttribute("hidden") && item.getAttribute("aria-hidden") !== "true");
    if (!focusable.length) {
      event.preventDefault();
      return true;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
      return true;
    }
    if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
      return true;
    }
    return false;
  }

  function handleKeydown(event) {
    const target = event.target;
    if (event.key === "Escape") {
      event.preventDefault();
      if (isOverlayOpen()) closeOverlays();
      else if (document.fullscreenElement) document.exitFullscreen();
      return;
    }
    if (trapModalFocus(event)) return;
    if (isOverlayOpen()) return;
    if (target && /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)) return;
    if (event.code === "Space" && target && /^(BUTTON|A)$/.test(target.tagName)) return;
    if (["ArrowRight", "PageDown"].includes(event.key)) {
      event.preventDefault();
      goTo(state.index + 1);
    } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
      event.preventDefault();
      goTo(state.index - 1);
    } else if (event.key === "Home") {
      event.preventDefault();
      goTo(0);
    } else if (event.key === "End") {
      event.preventDefault();
      goTo(state.deck.slides.length - 1);
    } else if (event.code === "Space" || event.key.toLowerCase() === "p") {
      event.preventDefault();
      togglePlay();
    } else if (event.key.toLowerCase() === "m") {
      event.preventDefault();
      openOverlay(dom.tocOverlay);
    } else if (event.key.toLowerCase() === "n") {
      event.preventDefault();
      openOverlay(dom.notesOverlay);
    }
  }

  function bindEvents() {
    dom.prev.addEventListener("click", () => goTo(state.index - 1));
    dom.next.addEventListener("click", () => goTo(state.index + 1));
    dom.play.addEventListener("click", togglePlay);
    dom.tocButton.addEventListener("click", () => openOverlay(dom.tocOverlay));
    dom.notesButton.addEventListener("click", () => openOverlay(dom.notesOverlay));
    dom.fullscreen.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (_error) {
        dom.fullscreen.textContent = "브라우저 메뉴 사용";
      }
    });

    document.addEventListener("keydown", handleKeydown);
    window.addEventListener("resize", fitStage);
    document.addEventListener("fullscreenchange", fitStage);
    window.addEventListener("hashchange", () => {
      const index = initialIndexFromHash();
      if (index !== state.index) goTo(index, { updateHash: false });
    });

    document.querySelectorAll("[data-close-overlay]").forEach((button) => button.addEventListener("click", closeOverlays));
    [dom.tocOverlay, dom.notesOverlay].forEach((overlay) => {
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeOverlays();
      });
    });
    dom.tocList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-slide-index]");
      if (!button) return;
      closeOverlays();
      goTo(Number(button.dataset.slideIndex));
    });
    dom.stage.addEventListener("click", (event) => {
      const button = event.target.closest("[data-demo-action]");
      if (!button) return;
      const action = button.dataset.demoAction;
      if (action === "previous") state.demoStep = Math.max(0, state.demoStep - 1);
      if (action === "next") {
        const lastStep = Math.max(0, dom.stage.querySelectorAll("[data-demo-step]").length - 1);
        state.demoStep = Math.min(lastStep, state.demoStep + 1);
      }
      if (action === "play") playDemoSequence();
      updateDemoView();
    });
  }

  function showError(error) {
    const view = element("div", "error-screen");
    const content = element("div");
    content.appendChild(element("h1", "", "발표 데이터를 열 수 없습니다"));
    content.appendChild(element("p", "", error && error.message ? error.message : String(error)));
    view.appendChild(content);
    dom.stage.replaceChildren(view);
    fitStage();
  }

  async function start() {
    try {
      state.deck = await readDeckData();
      dom.title.textContent = state.deck.title || "ITDA 본선 발표";
      buildToc();
      bindEvents();
      state.index = initialIndexFromHash();
      setHash(state.deck.slides[state.index]);
      renderSlide();
    } catch (error) {
      showError(error);
    }
  }

  start();
})();
</script>
</body>
</html>
