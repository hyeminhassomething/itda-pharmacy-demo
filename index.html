 ['03 / 반품 검토','상태와 근거를\n검토 목록으로 내보내기','X는 회수·반품 절차 확인 대상으로, 별도 B는 시연 규칙상 접수 시작 전으로 표시합니다. 기준일·수량·근거를 CSV로 내보낼 수 있습니다.','X: 회수 검토 / B: 접수 전','CSV는 검토 자료입니다. 반품 신청·회수 완료·판매 허가·환급 보장을 의미하지 않습니다.']
];
function badge(text,kind=''){return `<span class="badge ${kind}">${text}</span>`}
function drawLabel(){return `<div class="label-drawing"><div class="label-cap">DEMONSTRATION PACKAGE</div><div class="label-body"><div class="label-name">가상 품목 A</div><div class="label-line"><span>사용기한</span><b>2027.10.31</b></div><div class="label-line"><span>제조번호</span><b>X-DEMO-01</b></div><div class="label-line"><span>제조일</span><b>2024.11.01</b></div><div class="label-line"><span>표준코드 예시</span><b>8800000123456</b></div></div><div class="sample-note">시연용 표기 그림 · 실제 약품 사진 아님</div></div>`}
function ocrBlock(){return `<div class="line-card"><div class="ocr-line"><span class="role">사용기한</span><code>2027.10.31</code></div><div class="ocr-line"><span class="role">제조번호</span><code>X-DEMO-01</code></div><div class="ocr-line excluded"><span>제조일</span><code>2024.11.01</code><span class="excluded-tag">기한 제외</span></div><div class="ocr-line excluded"><span>표준코드</span><code>8800000123456</code><span class="excluded-tag">날짜 아님</span></div></div>`}
function reviewScreen(){if(!loaded)return `<h2 class="screen-title">포장 표기 확인</h2><p class="sub">시연용 포장의 사용기한과 제조번호를 확인합니다.</p><div class="scan-frame">${drawLabel()}<div class="scan-line"></div></div><button class="primary" data-action="load">시연 OCR 후보 불러오기</button><div class="note">고정 예시 원문을 불러옵니다.<br>카메라 촬영·OCR 추론은 연결되지 않았습니다.</div>`;
return `<h2 class="screen-title">OCR 후보 검수</h2><p class="sub">원문과 비교하고 확인한 값만 다음 단계로 전달합니다.</p>${ocrBlock()}<div class="fields"><div class="field"><label for="expiry">사용기한</label><input id="expiry" type="text" value="${escapeHTML(s.review.expiry)}" placeholder="YYYY-MM-DD" autocomplete="off"></div><div class="field"><label for="lot">제조번호 · LOT</label><input id="lot" type="text" value="${escapeHTML(s.review.lot)}" autocomplete="off"></div></div><label class="check"><input id="checked" type="checkbox" ${s.review.confirmed?'checked':''}>사용기한과 제조번호를 원문과 대조했습니다.</label><div class="note ${s.review.confirmed?'':'warn'}" id="review-note">${s.review.confirmed?'검수 확인됨 · 시연 입력<br>검수 버전 '+s.review.revision:'미확인 · 검수 후 거래를 연결합니다.'}</div><button class="primary" data-action="approve">${s.review.confirmed?'검수 다시 확인':'검수 확인'}</button><button class="secondary" id="go-bind" data-action="next" ${s.review.confirmed?'':'disabled'}>매입 기록 연결 →</button>`}
function transactionScreen(){return `<h2 class="screen-title">매입 기록 연결</h2><p class="sub">품목·LOT 원문이 맞는 가상 매입 전표를 연결합니다.</p><div class="line-card"><div class="table-row"><span>가상 품목 A · X<small class="mono">X-DEMO-01</small></span><b>입고 4개</b></div><div class="table-row"><span>가상 품목 A · Y<small class="mono">Y-DEMO-02</small></span><b>입고 6개</b></div><div class="table-row"><span>매입처<small>고정 시연 거래 · 실제 전산 조회 아님</small></span><b>공급처 A</b></div></div><div class="number-block"><small>2026-10-03 기준 · 품목 총재고</small><div class="number">8<span style="font-size:22px"> 개</span></div></div><div class="note">입고·입출고 기록의 완전성과 총재고 일치를 가정한 예시입니다.</div><button class="primary" data-action="bind" ${s.review.confirmed?'':'disabled'}>${s.transaction?'거래 연결 다시 확인':'가상 매입 기록 연결'}</button><button class="secondary" data-action="next" ${s.transaction?'':'disabled'}>회수 공지 대조 →</button>${s.transaction?'<div class="meta">연결됨 · '+escapeHTML(s.transaction.receiptId)+'</div>':''}`}
function recallScreen(){
 const r=s.recall,b=r&&r.bounds,compact=(replay||params.has('snapshot'))&&r&&r.verified;
 const notice=compact?`<div class="line-card"><div class="status-head">가상 회수 공지 ${badge('LOT 일치','red')}</div><p class="mono" style="font-size:19px;font-weight:800;margin:15px 0 5px">X-DEMO-01</p><div class="meta">가상 품목 A · 단일 제조번호 원문 대조</div></div>`:`<div class="line-card"><div class="status-head">가상 회수 공지 ${badge('시연','red')}</div><div class="meta">가상 품목 A · 단일 제조번호</div><div class="field" style="margin-top:12px"><label for="notice-lot">공지 제조번호 원문</label><input id="notice-lot" type="text" value="${escapeHTML(r?r.lotRaw:'X-DEMO-01')}"></div><label class="check"><input id="notice-checked" type="checkbox" ${r&&r.verified?'checked':''}>가상 공지의 품목·대상 범위를 확인했습니다.</label><button class="secondary" data-action="recall" ${s.transaction?'':'disabled'}>공지와 LOT 대조</button></div>`;
 const result=b?`<div class="number-block red"><small>대상 LOT X · 조건부 잔량 범위</small><div class="number">${b.minimum}–${b.maximum}<span style="font-size:22px"> 개</span></div><small>완전한 기록·총재고 일치 전제</small></div><div class="inline"><input id="count" aria-label="X 실사 수량" type="number" min="${b.minimum}" max="${b.maximum}" step="1" value="${s.count?s.count.quantity:3}"><button class="primary" data-action="count">실사 수량 확인</button></div>${s.count?`<div class="note" id="count-note">X 실사 <b>${s.count.quantity}개</b> 확인 · 시연 입력<br>Y ${s.count.otherQuantity}개는 잔여 계산값(미실사)</div><button class="secondary" data-action="next">반품 검토 목록 →</button>`:''}`:r?`<div class="note warn">${escapeHTML(r.reason)}<br><span class="mono">${escapeHTML(r.code)}</span></div>`:'<div class="note">공지 확인 전에는 회수 대상 여부나 잔량을 확정하지 않습니다.</div>';
 return `<h2 class="screen-title">리콜 레이더</h2><p class="sub">가상 공지의 품목·제조번호를 거래 기록과 대조합니다.</p>${notice}<div id="recall-result">${result}</div>`;
}
function resultsScreen(){const a=s.returnResult,b=s.normalReturnResult;return `<h2 class="screen-title">회수·반품 검토</h2><p class="sub">기준일 2026-10-03 · 시연용 규칙</p><div class="status-card"><div class="status-head">가상 품목 A · X ${badge(a&&a.status==='HOLD'?'조건 보류':'회수 검토',a&&a.status==='HOLD'?'yellow':'red')}</div><code>X-DEMO-01</code><div class="result-line">대상 LOT 실사 <b>${s.count?s.count.quantity:'미확인'}</b>${s.count?'개':''}</div><p>${a?escapeHTML(a.reason):'검토 결과를 계산해 주세요.'}</p><code>${a?escapeHTML(a.code):'NOT_EVALUATED'}</code></div><div class="status-card ${b&&b.status==='NOT_OPEN_YET'?'blue':'yellow'}"><div class="status-head">별도 품목 B ${badge(b&&b.status==='NOT_OPEN_YET'?'접수 시작 전':'조건 보류',b&&b.status==='NOT_OPEN_YET'?'':'yellow')}</div><code>Z-DEMO-03</code><p>${b&&b.status==='NOT_OPEN_YET'?'시연 접수창 2026-11-28 ~ 2027-02-28<br>기준일은 접수 시작 전입니다.':'반품 규칙 미확인 · 임의로 접수 가능 여부를 판단하지 않습니다.'}</p><code>${b?escapeHTML(b.code):'NOT_EVALUATED'}</code></div><div class="inline"><button class="secondary" data-action="unknown">규칙 미확인</button><button class="secondary" data-action="known">시연 규칙 적용</button></div><button class="primary" data-action="csv" ${a||b?'':'disabled'}>검토 목록 CSV 내보내기</button><div class="meta">내보내기는 반품 접수나 회수 완료가 아닙니다.</div>`}
function render(){const container=$('phone-screen');container.innerHTML=[reviewScreen,transactionScreen,recallScreen,resultsScreen][screen]()+`<div class="note red" id="error" role="alert">${escapeHTML(error)}</div>`;document.querySelectorAll('[data-screen]').forEach(el=>{el.classList.toggle('active',Number(el.dataset.screen)===screen);el.setAttribute('aria-current',Number(el.dataset.screen)===screen?'step':'false')});}
function toast(msg){$('toast').textContent=msg;setTimeout(()=>{$('toast').textContent=''},4000)}
function calculate(known){s=E.evaluateReturn(s,{ruleKnown:known});s=E.evaluateNormalReturn(s,{ruleKnown:known})}
function download(name,text,type){const blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function action(name){error='';try{switch(name){case 'load':loaded=true;break;case 'approve':s=E.confirmReview(s,{expiry:$('expiry').value,lot:$('lot').value,checked:$('checked').checked});error=s.review.errors.join(' ');break;case 'bind':s=E.bindTransaction(s);toast('시연 거래가 현재 검수 버전에 연결됐습니다.');break;case 'recall':s=E.evaluateRecall(s,{verified:$('notice-checked').checked,lotRaw:$('notice-lot').value});break;case 'count':{const raw=$('count').value;if(raw.trim()==='')throw Error('실사 수량을 입력해 주세요.');s=E.confirmCount(s,Number(raw));break;}case 'next':if(screen===0&&!s.review.confirmed)throw Error('검수 확인이 필요합니다.');if(screen===1&&!s.transaction)throw Error('거래 연결이 필요합니다.');if(screen===2){if(!s.count)throw Error('실사 수량을 먼저 확인해 주세요.');calculate(false)}screen=Math.min(3,screen+1);break;case 'unknown':calculate(false);break;case 'known':calculate(true);break;case 'csv':download('시연_회수반품_검토목록.csv',E.exportCSV(s),'text/csv;charset=utf-8');toast('CSV를 내보냈습니다. 실제 신청은 수행하지 않았습니다.');break;case 'reset':s=E.createState();screen=0;loaded=false;break;}}
catch(e){error=e.message}render()}
function replayState(i){s=E.createState();loaded=i>=1;screen=0;if(i>=2)s=E.confirmReview(s,{expiry:s.fixture.expiry,lot:s.fixture.targetLot,checked:true});if(i>=3){s=E.bindTransaction(s);screen=1}if(i>=4){s=E.evaluateRecall(s,{verified:true,lotRaw:s.fixture.targetLot});screen=2}if(i>=5)s=E.confirmCount(s,3);if(i>=6){calculate(i>=7);screen=3}error='';render()}
function setStep(i,seek=true){i=Math.max(0,Math.min(7,i));if(seek)clock=starts[i];if(i!==currentStep){currentStep=i;replayState(i);if(replay){const t=steps[i];$('stage-step').textContent=t[0];$('stage-title').innerHTML=escapeHTML(t[1]).replace(/\n/g,'<br>');$('stage-copy').textContent=t[2];$('large-result').textContent=t[3];$('footnote').textContent=t[4];const stage=$('stage');stage.classList.remove('transition');void stage.offsetWidth;stage.classList.add('transition');document.querySelectorAll('[data-step]').forEach(el=>{el.classList.toggle('done',Number(el.dataset.step)<i);el.classList.toggle('active',Number(el.dataset.step)===i)})}}updateClock()}
function updateClock(){if(!replay)return;const sec=Math.min(120,Math.floor(clock));$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')+' / 02:00';$('play').textContent=playing?'일시정지':'재생';$('prev').disabled=currentStep===0;$('next').disabled=currentStep===7}
function playToggle(){if(clock>=120){clock=0;currentStep=-1;setStep(0)}playing=!playing;lastTick=performance.now();updateClock()}
function resize(){if(!replay)return;const scale=Math.min(innerWidth/1600,innerHeight/900),stage=$('stage');stage.style.transform=`scale(${scale})`;stage.style.left=(innerWidth-1600*scale)/2+'px';stage.style.top=(innerHeight-900*scale)/2+'px'}
document.addEventListener('click',ev=>{const actionEl=ev.target.closest('[data-action]');if(actionEl&&!replay){action(actionEl.dataset.action);return}const tab=ev.target.closest('[data-screen]');if(tab&&!replay){const n=Number(tab.dataset.screen);if((n>=1&&!s.review.confirmed)||(n>=2&&!s.transaction)||(n>=3&&!s.count)){toast('이전 단계의 검수·연결·실사를 먼저 완료해 주세요.');return}if(n===3&&!s.returnResult)calculate(false);screen=n;error='';render()}const step=ev.target.closest('[data-step]');if(step&&replay){playing=false;setStep(Number(step.dataset.step))}});
document.addEventListener('input',ev=>{
 if(replay)return;
 if(['expiry','lot'].includes(ev.target.id)){s=E.updateReview(s,{expiry:$('expiry').value,lot:$('lot').value});$('checked').checked=false;$('go-bind').disabled=true;$('review-note').className='note warn';$('review-note').textContent='값 변경됨 · 검수와 이후 연결을 다시 확인하세요.';$('error').textContent=''}
 if(['notice-lot','notice-checked'].includes(ev.target.id)&&s.transaction){s=E.evaluateRecall(s,{verified:false,lotRaw:$('notice-lot').value});$('recall-result').innerHTML='<div class="note warn">공지 변경됨 · 다시 대조해 주세요. 이전 범위·실사·검토 결과는 무효화됐습니다.</div>';$('error').textContent=''}
 if(ev.target.id==='count'){s=E.invalidateCount(s);if($('count-note')){$('count-note').className='note warn';$('count-note').textContent='실사 수량 변경됨 · 다시 확인해 주세요.'}document.querySelectorAll('[data-action=next]').forEach(el=>el.disabled=true);$('error').textContent=''}
});
document.addEventListener('change',ev=>{if(!replay&&ev.target.id==='checked'&&!ev.target.checked){s=E.updateReview(s,{expiry:$('expiry').value,lot:$('lot').value});$('go-bind').disabled=true;$('review-note').className='note warn';$('review-note').textContent='검수 확인 해제 · 이후 연결이 무효화됐습니다.'}});
if(replay){$('play').onclick=playToggle;$('prev').onclick=()=>{playing=false;setStep(currentStep-1)};$('next').onclick=()=>{playing=false;setStep(currentStep+1)};$('reset').onclick=()=>{playing=false;currentStep=-1;setStep(0)};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>toast('브라우저 전체화면 메뉴를 이용해 주세요.'))};addEventListener('resize',resize);document.addEventListener('keydown',ev=>{if(ev.code==='Space'){ev.preventDefault();playToggle()}if(ev.key==='ArrowRight'){ev.preventDefault();playing=false;setStep(currentStep+1)}if(ev.key==='ArrowLeft'){ev.preventDefault();playing=false;setStep(currentStep-1)}if(ev.key.toLowerCase()==='r'){playing=false;currentStep=-1;setStep(0)}});resize();setStep(Number(params.get('step'))||0);function tick(now){if(playing){clock=Math.min(120,clock+(now-lastTick)/1000);if(clock>=120)playing=false;const idx=starts.reduce((j,start,k)=>clock>=start?k:j,0);setStep(idx,false)}lastTick=now;requestAnimationFrame(tick)}requestAnimationFrame(tick)}else{if(params.has('snapshot')){document.documentElement.classList.add('snapshot');replayState(Number(params.get('snapshot'))||0)}else render()}
window.DemoUI={getState:()=>s,getScreen:()=>screen,setStep:i=>{playing=false;currentStep=-1;setStep(i)},getPlayback:()=>({clock,playing,currentStep}),exportCSV:()=>E.exportCSV(s)};
})();
</script></body></html>
